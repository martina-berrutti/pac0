<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo crudo</title>
<style>body { margin: 0; background: #e9e6e1; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Muestra un GLB tal cual, sin TalkingHead: para ver si el problema está en
// el modelo o en las animaciones. ?m=nombre&y=altura de la cámara
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment()).texture;
const camera = new THREE.PerspectiveCamera(20, innerWidth / innerHeight, 0.01, 50);
const y = Number(q.get("y") ?? 1.45);
camera.position.set(0, y, 1.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, y, 0);
controls.update();
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
loader.load(`modelos/${q.get("m") ?? "mujer-joven"}.glb`, (g) => {
	scene.add(g.scene);
	window.modelo = g.scene;
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
