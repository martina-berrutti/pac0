<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avatares de Paco</title>
<style>
	:root { --fondo: #e9e6e1; --tinta: #2b2a28; --suave: #6f6b65; --acento: #2f6f5e; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: system-ui, sans-serif; background: var(--fondo); color: var(--tinta); }
	header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	h1 { font-size: 18px; margin: 0 12px 0 0; }
	button { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 999px; border: 1px solid #c9c4bc; background: #fff; color: var(--tinta); cursor: pointer; }
	button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
	#escena { position: relative; height: calc(100svh - 150px); min-height: 360px; }
	#avatar { position: absolute; inset: 0; }
	#estado { position: absolute; left: 16px; bottom: 12px; color: var(--suave); font-size: 13px; }
	.fila { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
	.fila span { color: var(--suave); font-size: 13px; margin-right: 4px; }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
	"talkinghead": "https://cdn.jsdelivr.net/npm/@met4citizen/talkinghead@1.7.0/modules/talkinghead.mjs"
} }
</script>
</head>
<body>
<header>
	<h1>Avatares de Paco</h1>
	<div id="personas" role="group" aria-label="Paciente"></div>
</header>
<div class="fila" role="group" aria-label="Acciones">
	<span>Probar:</span>
	<button data-hablar>Hablar</button>
	<button data-vista="head" aria-pressed="true">Cara</button>
	<button data-vista="upper">Medio cuerpo</button>
	<button data-vista="full">Cuerpo entero</button>
	<span>Ánimo:</span>
	<button data-animo="neutral" aria-pressed="true">Tranquilo</button>
	<button data-animo="happy">Feliz</button>
	<button data-animo="sad">Triste</button>
	<button data-animo="angry">Enojado</button>
	<button data-animo="fear">Ansioso</button>
	<button data-gesto="handup">Saludar</button>
	<button data-gesto="shrug">No sé</button>
	<span>Luz:</span>
	<button data-luz="estudio" aria-pressed="true">De estudio</button>
	<button data-luz="original">Original</button>
</div>
<div id="escena"><div id="avatar"></div><p id="estado">Cargando…</p></div>

<script type="module">
import { TalkingHead } from "talkinghead";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { Labios } from "./labios-es.mjs";
import { luzDeEstudio } from "./escena.mjs";

// Los modelos vienen con meshopt (como mpfb.glb de Lucía).
const parse = GLTFLoader.prototype.parse;
GLTFLoader.prototype.parse = function (...args) {
	this.setMeshoptDecoder(MeshoptDecoder);
	return parse.apply(this, args);
};

const PERSONAS = [
	["senor-mayor", "Señor mayor", "M"],
	["senora-mayor", "Señora mayor", "F"],
	["hombre-adulto", "Hombre adulto", "M"],
	["mujer-adulta", "Mujer adulta", "F"],
	["hombre-joven", "Hombre joven", "M"],
	["mujer-joven", "Mujer joven", "F"],
	["nino", "Niño", "M"],
	["nina", "Niña", "F"],
	["lucia-actual", "Lucía (la de hoy)", "F"],
];

const estado = document.getElementById("estado");
const head = new TalkingHead(document.getElementById("avatar"), {
	ttsEndpoint: null,
	lipsyncModules: [],
	cameraView: "head",
	cameraRotateEnable: true,
	avatarMood: "neutral",
});

window.head = head; // para revisar desde la consola
let actual = null;
async function mostrar(id) {
	const p = PERSONAS.find((x) => x[0] === id) ?? [id, id, "F"];
	estado.textContent = `Cargando ${p[1]}…`;
	for (const b of document.querySelectorAll("#personas button"))
		b.setAttribute("aria-pressed", String(b.dataset.id === id));
	try {
		await head.showAvatar({ url: `modelos/${id}.glb`, body: p[2], avatarMood: "neutral" });
		luzDeEstudio(head, document.querySelector("[data-luz=estudio]").getAttribute("aria-pressed") === "true");
		// La cámara depende de la altura de los ojos: se recalcula con cada uno.
		head.setView(document.querySelector("[data-vista][aria-pressed=true]")?.dataset.vista ?? "head");
		actual = id;
		estado.textContent = `${p[1]}. Arrastrá para girar la cámara.`;
	} catch (e) {
		estado.textContent = `No se pudo cargar ${p[1]}: ${e.message}`;
	}
}

const personas = document.getElementById("personas");
for (const [id, nombre] of PERSONAS) {
	const b = document.createElement("button");
	b.textContent = nombre;
	b.dataset.id = id;
	b.onclick = () => mostrar(id);
	personas.append(b);
}

// Habla con la voz del navegador; los labios siguen cada palabra en español
// (labios-es.mjs).
const labios = new Labios(head);
const FRASE = "Hola, doctora. Me duele la garganta desde hace dos días.";
function hablar() {
	const u = new SpeechSynthesisUtterance(FRASE);
	const voz = speechSynthesis.getVoices().find((v) => v.lang.startsWith("es"));
	if (voz) u.voice = voz;
	u.lang = voz?.lang ?? "es-AR";
	let porPalabra = false;
	u.onboundary = (e) => {
		if (e.name !== "word") return;
		porPalabra = true;
		const palabra = FRASE.slice(e.charIndex).match(/^[^\s]+/)?.[0] ?? "";
		labios.decir(palabra, performance.now(), Math.max(160, palabra.length * 62));
	};
	u.onstart = () => setTimeout(() => { if (!porPalabra) labios.decir(FRASE); }, 250);
	u.onend = () => setTimeout(() => labios.callar(), 200);
	speechSynthesis.cancel();
	speechSynthesis.speak(u);
}

function marcar(grupo, boton) {
	for (const b of document.querySelectorAll(`[data-${grupo}]`))
		b.setAttribute("aria-pressed", String(b === boton));
}
document.querySelector("[data-hablar]").onclick = hablar;
for (const b of document.querySelectorAll("[data-vista]"))
	b.onclick = () => { head.setView(b.dataset.vista); marcar("vista", b); };
for (const b of document.querySelectorAll("[data-animo]"))
	b.onclick = () => { head.setMood(b.dataset.animo); marcar("animo", b); };
for (const b of document.querySelectorAll("[data-luz]"))
	b.onclick = () => { luzDeEstudio(head, b.dataset.luz === "estudio"); marcar("luz", b); };
for (const b of document.querySelectorAll("[data-gesto]"))
	b.onclick = () => head.playGesture(b.dataset.gesto, 3);

// ?m=archivo carga cualquier modelo de la carpeta (para pruebas).
mostrar(new URLSearchParams(location.search).get("m") ?? "mujer-joven");
</script>
</body>
</html>
